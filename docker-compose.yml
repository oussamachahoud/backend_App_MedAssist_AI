version: '3.8'

services:
  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medassist_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://medassist:secret@postgres:5432/medassist_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=medassist
      - MINIO_SECRET_KEY=medassist_secret
      - JWT_SECRET_KEY=medassist_super_secret_jwt_key_v2_2026_change_in_prod
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - INITIAL_ADMIN_EMAIL=admin@medassist.dz
      - INITIAL_ADMIN_PASSWORD=Admin@MedAssist2026!
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    # Shared Memory & Resource Limits
    shm_size: '256m'
    mem_limit: 5g
    memswap_limit: 6g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medassist_postgres
    environment:
      - POSTGRES_USER=medassist
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=medassist_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medassist -d medassist_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── MinIO Object Storage (Images + Grad-CAM) ────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: medassist_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=medassist
      - MINIO_ROOT_PASSWORD=medassist_secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
