<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MedAssist AI Dashboard</title>
  <script src="/dashboard/assets/js/api.js"></script>
  <script>
    const user = window.api.getCurrentUser();
    if (user && window.api.token) {
      if (user.role === 'admin') {
        window.location.href = '/dashboard/admin.html';
      } else {
        window.location.href = '/dashboard/doctor.html';
      }
    } else {
      window.location.href = '/dashboard/login.html';
    }
  </script>
</head>
<body style="background: #040914; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
  <p>Redirecting to MedAssist AI Portal...</p>
</body>
</html>
