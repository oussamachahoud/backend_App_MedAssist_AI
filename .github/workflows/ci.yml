name: MedAssist AI Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8 httpx

      - name: Lint code syntax with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run automated test suite (119 pytest tests)
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          JWT_SECRET_KEY: ci_test_jwt_secret_key_medassist_2026
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test_minio_user
          MINIO_SECRET_KEY: test_minio_secret
        run: |
          pytest tests/ -v

      - name: Build Docker Image
        run: |
          docker build -t medassist-backend:latest .
