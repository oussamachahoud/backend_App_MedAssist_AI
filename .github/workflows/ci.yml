name: MedAssist AI Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 -r backend_App_MedAssist_AI/requirements.txt || pip install pytest flake8 FastAPI uvicorn

      - name: Lint code with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend_App_MedAssist_AI --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Build Docker Image
        run: |
          docker build -t medassist-backend:latest backend_App_MedAssist_AI
